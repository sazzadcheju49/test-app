<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Exam Platform</title>
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bubble-size: 36px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.5;
        }

        /* --- LAYOUT & CARDS --- */
        .card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* --- FORMS & BUTTONS --- */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background-color: var(--bg);
        }

        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        /* --- OMR GRID & BUBBLES --- */
        .omr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .question-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: background-color 0.2s;
        }

        .question-row:hover { background-color: var(--bg); }

        .q-number {
            font-weight: 600;
            width: 32px;
            text-align: right;
            color: var(--text-muted);
        }

        .bubbles { display: flex; gap: 10px; }

        .bubble {
            width: var(--bubble-size);
            height: var(--bubble-size);
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            background: var(--card-bg);
        }

        .bubble:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .bubble.selected {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .bubble.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .bubble.wrong {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        /* --- EXAM SPECIFICS --- */
        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fee2e2;
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        #linkContainer, #resultContainer {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }

        .link-input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: white;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.9rem;
            resize: none;
        }

        /* --- CUSTOM UI (MODALS & TOASTS) --- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error { background: var(--danger); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
        .modal-body { color: var(--text-muted); margin-bottom: 24px; }
    </style>
</head>
<body>

    <!-- CUSTOM TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- CUSTOM MODAL -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Notice</div>
            <div class="modal-body" id="modalBody">Message here</div>
            <button class="btn btn-success" id="modalBtn">Continue</button>
        </div>
    </div>

    <!-- TEACHER MODE: Initial Config -->
    <div class="card" id="teacherSetup">
        <div class="header-top">
            <h2 class="header-title">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.12-1.15V17h2V8.08L12 3zm6.8 5.92L12 12.6l-6.8-3.68L12 5.25l6.8 3.67zM12 18.72l-5-2.73v-4.57l5 2.72 5-2.72v4.57l-5 2.73z"/></svg>
                Exam Configuration
            </h2>
        </div>
        <p style="color: var(--text-muted); margin-bottom: 24px;">Configure the parameters for your stateless exam link.</p>
        
        <div class="form-group">
            <label>Total Questions</label>
            <input type="number" id="t-questions" value="20" min="1">
        </div>
        <div class="form-group">
            <label>Time Limit (Minutes)</label>
            <input type="number" id="t-time" value="15" min="1">
        </div>
        <div class="form-group">
            <label>Options per Question</label>
            <input type="number" id="t-options" value="4" min="2" max="6">
        </div>
        <div class="form-group">
            <label>Negative Mark (Penalty per wrong answer)</label>
            <input type="number" id="t-negative" value="0.25" step="0.01" min="0">
        </div>
        <button class="btn" onclick="startKeySetup()">Next: Setup Answer Key</button>
    </div>

    <!-- TEACHER MODE: Set Answer Key -->
    <div class="card" id="teacherKeySetup" style="display: none;">
        <div class="header-top">
            <h2 class="header-title">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                Define Answer Key
            </h2>
        </div>
        <p style="color: var(--text-muted);">Tap the correct bubble for each question to generate your master key.</p>
        
        <div id="teacherOmrContainer" class="omr-grid"></div>
        
        <button class="btn btn-success" style="margin-top: 24px;" onclick="generateStudentLink()">Generate Student Link</button>
        
        <div id="linkContainer">
            <label style="font-weight: 600;">Shareable Exam Link</label>
            <textarea id="studentLink" class="link-input" rows="3" readonly></textarea>
            <div class="action-group">
                <button class="btn btn-outline" onclick="copyLink()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy Link
                </button>
                <button class="btn btn-outline" onclick="shareLink()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                    Share
                </button>
            </div>
        </div>
    </div>

    <!-- STUDENT MODE: Taking the Exam -->
    <div class="card" id="examView" style="display: none;">
        <div class="header-top">
            <h2 class="header-title">OMR Answer Sheet</h2>
            <div class="timer-badge">
                <svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span id="timerDisplay">00:00</span>
            </div>
        </div>
        
        <div id="studentOmrContainer" class="omr-grid" style="margin-bottom: 32px;"></div>
        
        <button class="btn btn-success" id="submitBtn" onclick="submitExam()">Submit Answers</button>
        
        <div id="resultContainer"></div>
    </div>

    <script>
        // --- GLOBAL VARIABLES ---
        const alphabet = ['A', 'B', 'C', 'D', 'E', 'F'];
        let config = {};
        let teacherAnswers = {};
        let studentAnswers = {};
        let timerInterval;

        // --- INITIALIZATION ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const examData = urlParams.get('exam');

            if (examData) {
                // Student Mode
                document.getElementById('teacherSetup').style.display = 'none';
                document.getElementById('examView').style.display = 'block';
                try {
                    config = JSON.parse(atob(examData)); 
                    generateOMR('studentOmrContainer', true);
                    startTimer();
                } catch (e) {
                    // [PLACEHOLDER 1 will handle showing error toast instead of alert]
                    alert("Invalid exam link."); 
                }
            }
        };

        // --- UI HELPERS: TOAST & MODAL ---
        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300); // Wait for transition
            }, 3000);
        }

        function showModal(title, message, callback = null) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = message; // allows basic html like <br>
            
            const btn = document.getElementById('modalBtn');
            // Clone button to strip old event listeners
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.onclick = () => {
                modal.classList.remove('show');
                if (callback) callback();
            };
            
            modal.classList.add('show');
        }

        // --- TEACHER SETUP LOGIC & LINK GENERATION ---
        function startKeySetup() {
            const q = parseInt(document.getElementById('t-questions').value);
            const t = parseInt(document.getElementById('t-time').value);
            const o = parseInt(document.getElementById('t-options').value);
            const n = parseFloat(document.getElementById('t-negative').value);

            if (isNaN(q) || q < 1 || isNaN(t) || t < 1 || isNaN(o) || o < 2 || o > 6 || isNaN(n) || n < 0) {
                showToast("Please enter valid positive numbers in all fields.", true);
                return;
            }

            config = { q, t, o, n };
            
            document.getElementById('teacherSetup').style.display = 'none';
            document.getElementById('teacherKeySetup').style.display = 'block';
            
            generateOMR('teacherOmrContainer', false);
        }

        function generateStudentLink() {
            // Verify teacher answered all questions for the key
            let keyArray = [];
            let missing = [];
            
            for (let i = 1; i <= config.q; i++) {
                if (!teacherAnswers[i]) {
                    missing.push(i);
                } else {
                    keyArray.push(teacherAnswers[i]);
                }
            }
            
            if (missing.length > 0) {
                // If missing more than 5, truncate the list so the modal doesn't get huge
                let missingText = missing.slice(0, 5).join(', ');
                if (missing.length > 5) missingText += `... and ${missing.length - 5} more`;
                
                showModal("Missing Answers", `You must select the correct answer for question(s): <br><br><strong>${missingText}</strong>`);
                return;
            }
            
            config.k = keyArray.join(''); // e.g. "ABCD..."
            
            // Encode the configuration into a Base64 string
            const encodedConfig = btoa(JSON.stringify(config));
            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = `${baseUrl}?exam=${encodedConfig}`;
            
            document.getElementById('linkContainer').style.display = 'block';
            document.getElementById('studentLink').value = finalUrl;
            
            showToast("Exam link generated successfully!");
        }

        function copyLink() {
            const linkText = document.getElementById('studentLink');
            if (!linkText.value) return;
            
            linkText.select();
            linkText.setSelectionRange(0, 99999); // For mobile devices
            
            // Modern Clipboard API fallback
            navigator.clipboard.writeText(linkText.value).then(() => {
                showToast("Link copied to clipboard!");
            }).catch(() => {
                showToast("Failed to copy link.", true);
            });
        }

        function shareLink() {
            const linkText = document.getElementById('studentLink');
            if (!linkText.value) return;

            if (navigator.share) {
                navigator.share({
                    title: 'OMR Exam',
                    text: `Join the exam. You have ${config.t} minutes. Good luck!`,
                    url: linkText.value
                }).then(() => {
                    showToast("Shared successfully!");
                }).catch((error) => {
                    // Ignore abort errors (user closed the share sheet)
                    if (error.name !== 'AbortError') {
                        showToast("Error sharing link.", true);
                    }
                });
            } else {
                showToast("Native sharing is not supported on your current browser.", true);
            }
        }

        // --- OMR GENERATOR ---
        function generateOMR(containerId, isStudent) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // Clear any existing content
            
            for (let i = 1; i <= config.q; i++) {
                const row = document.createElement('div');
                row.className = 'question-row';
                row.id = `q-row-${i}`;
                
                const qNum = document.createElement('div');
                qNum.className = 'q-number';
                qNum.textContent = i + '.';
                
                const bubblesContainer = document.createElement('div');
                bubblesContainer.className = 'bubbles';
                
                for (let j = 0; j < config.o; j++) {
                    const optionLetter = alphabet[j];
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.textContent = optionLetter;
                    bubble.id = `q${i}-${optionLetter}`;
                    
                    bubble.onclick = (e) => {
                        // Prevent students from clicking bubbles after the exam is submitted
                        if (isStudent && timerInterval === null) return;
                        
                        // Remove "selected" state from all other bubbles in THIS row
                        const bubbles = bubblesContainer.getElementsByClassName('bubble');
                        Array.from(bubbles).forEach(b => b.classList.remove('selected'));
                        
                        // Add "selected" state to the clicked bubble
                        e.target.classList.add('selected');
                        
                        // Save the choice to the respective dictionary
                        if (isStudent) {
                            studentAnswers[i] = optionLetter;
                        } else {
                            teacherAnswers[i] = optionLetter;
                        }
                    };
                    bubblesContainer.appendChild(bubble);
                }
                
                row.appendChild(qNum);
                row.appendChild(bubblesContainer);
                container.appendChild(row);
            }
        }

        // --- STUDENT EXAM TIMER & GRADING ---
        function startTimer() {
            let timeLeft = config.t * 60;
            const display = document.getElementById('timerDisplay');
            
            // Function to update the UI timer string
            const updateDisplay = () => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                display.textContent = 
                    (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                    (seconds < 10 ? "0" + seconds : seconds);
            };
            
            updateDisplay(); // Run once immediately
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null; // Setting to null locks the bubbles in OMR generator
                    
                    // Use our custom modal instead of a browser alert
                    showModal(
                        "Time's Up!", 
                        "Your exam duration has ended. Your answers will now be submitted automatically.", 
                        submitExam // Run submit function when they click Continue
                    );
                }
            }, 1000);
        }

        function submitExam() {
            // If they clicked the submit button manually, clear the timer
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null; 
            }
            
            let correct = 0;
            let wrong = 0;
            let unattempted = 0;
            const keyArray = config.k.split('');

            // Calculate score and colorize bubbles
            for (let i = 1; i <= config.q; i++) {
                const studentAns = studentAnswers[i];
                const correctAns = keyArray[i - 1];

                // Highlight the correct answer in green unconditionally
                const correctBubble = document.getElementById(`q${i}-${correctAns}`);
                if (correctBubble) correctBubble.classList.add('correct');

                if (!studentAns) {
                    unattempted++;
                } else if (studentAns === correctAns) {
                    correct++;
                } else {
                    wrong++;
                    // Highlight the student's wrong answer in red
                    const wrongBubble = document.getElementById(`q${i}-${studentAns}`);
                    if (wrongBubble) wrongBubble.classList.add('wrong');
                }
            }

            const penalty = wrong * config.n;
            const totalScore = (correct * 1) - penalty;
            
            // Hide the submit button and show the results dashboard
            document.getElementById('submitBtn').style.display = 'none';
            const resultDiv = document.getElementById('resultContainer');
            resultDiv.style.display = 'block';
            
            // Injecting the polished results UI
            resultDiv.innerHTML = `
                <div style="text-align: center; margin-bottom: 24px;">
                    <svg class="icon" style="width:48px;height:48px;color:var(--success);margin-bottom:8px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <h3 style="margin:0; font-size:1.5rem;">Exam Completed</h3>
                </div>
                
                <div class="action-group" style="margin-bottom: 20px;">
                    <div style="background:var(--card-bg); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                        <div style="font-size:0.9rem; color:var(--text-muted); font-weight:600;">Correct</div>
                        <div style="font-size:1.25rem; font-weight:700; color:var(--success);">${correct}</div>
                    </div>
                    <div style="background:var(--card-bg); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                        <div style="font-size:0.9rem; color:var(--text-muted); font-weight:600;">Wrong</div>
                        <div style="font-size:1.25rem; font-weight:700; color:var(--danger);">${wrong}</div>
                    </div>
                    <div style="background:var(--card-bg); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                        <div style="font-size:0.9rem; color:var(--text-muted); font-weight:600;">Unattempted</div>
                        <div style="font-size:1.25rem; font-weight:700;">${unattempted}</div>
                    </div>
                    <div style="background:var(--card-bg); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                        <div style="font-size:0.9rem; color:var(--text-muted); font-weight:600;">Penalty</div>
                        <div style="font-size:1.25rem; font-weight:700; color:var(--danger);">-${penalty.toFixed(2)}</div>
                    </div>
                </div>
                
                <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">
                
                <div style="text-align:center;">
                    <div style="font-size:1rem; color:var(--text-muted); margin-bottom:8px;">Final Score</div>
                    <div style="font-size:2.5rem; font-weight:800; color:var(--primary); line-height:1;">
                        ${totalScore.toFixed(2)} <span style="font-size:1rem; color:var(--text-muted); font-weight:500;">/ ${config.q}</span>
                    </div>
                </div>
                
                <p style="text-align:center; font-size:0.9rem; color:var(--text-muted); margin-top:24px; padding:16px; background:var(--bg); border-radius:var(--radius-sm);">
                    Scroll up to review your answers.<br>
                    <span style="color:var(--success); font-weight:600;">Green</span> is correct. 
                    <span style="color:var(--danger); font-weight:600;">Red</span> is your incorrect selection.
                </p>
            `;
            
            // Smoothly scroll to top so they see the header and can review their bubbles
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // We wait 500ms so the scroll happens before showing the toast
            setTimeout(() => {
                showToast("Exam submitted successfully!");
            }, 500);
        }

    </script>
</body>
</html>
